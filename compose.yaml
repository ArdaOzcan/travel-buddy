services:
  db:
    image: postgres:16-alpine
    container_name: travel_buddy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_buddy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-travel_buddy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: travel_buddy_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-travel_buddy}
      FLASK_ENV: development
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: flask --app app run --host=0.0.0.0 --port=5000 --debug

volumes:
  pgdata:
